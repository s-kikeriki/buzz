# PARKED — this file does nothing where it is.
#
# GitHub only runs workflows under `.github/workflows/`. It is here because the
# token the agent pushes with has no `workflow` scope, so any push touching that
# directory is rejected by the remote. Moving it is one command, run by a human:
#
#     git mv .github/workflows-pending/flavor-build.yml .github/workflows/
#     git commit -s -m "ci: add the ki.keriki flavor build"
#
# Actions has never run on this fork, so it also has to be enabled once, in
# Settings -> Actions -> General -> "Allow all actions and reusable workflows".
# Until both are done, the Run workflow button does not exist.
#
# ---------------------------------------------------------------------------
#
# What this is for: Ian's Windows VM and Ethos's Debian box. Neither installer
# can be produced on the Mac these builds are made on — Linux needs
# webkit2gtk/gtk3/libsoup, which do not exist on macOS and cannot be
# cross-linked, and that machine has no docker, podman, colima, lima or qemu.
# `release.yml` already solves both, on a tag, for stock Buzz. This is the same
# two jobs with the flavor applied and everything release-only removed.
#
# What was deliberately dropped from `release.yml`:
#
#   * tag binding (`verify-release-ref.sh`) — this runs from a branch, on demand
#   * the updater: no `build-release-config.mjs`, no `createUpdaterArtifacts`,
#     no `TAURI_SIGNING_PRIVATE_KEY`, no `.sig`, no `latest.json`. The updater
#     plugin is `#[cfg(buzz_updater_enabled)]`, so a build with no updater
#     config simply does not register it.
#   * `assemble-manifest` and the GitHub release upload. The artifacts come out
#     of the Actions run and are placed by hand.
#
# Neither installer is signed. Windows SmartScreen will warn on first run
# ("More info" -> "Run anyway") and Linux has nothing to warn about. That is
# the same position the macOS DMG is in — it is ad-hoc signed — and it is fine
# for the two people installing these.

name: Flavor build

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Which app to build
        type: choice
        options: [ki.keriki, zeniad]
        default: ki.keriki
      linux:
        description: Build the Linux .deb and AppImage
        type: boolean
        default: true
      windows:
        description: Build the Windows x64 installer
        type: boolean
        default: true
      windows_arm:
        description: Also try a native arm64 Windows installer (may fail)
        type: boolean
        default: true
      version:
        description: Version to stamp, e.g. 0.5.28. Blank keeps the repo's.
        type: string
        default: ""

concurrency:
  # Keyed on the flavor as well as the ref: two flavors share one `target/`
  # directory in a checkout but not across runners, and queueing a ki.keriki
  # build behind a zeniad one on a different branch helps nobody.
  group: flavor-build-${{ github.ref }}-${{ inputs.flavor }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux (deb + AppImage)
    if: inputs.linux
    runs-on: ubuntu-latest
    # Digest-pinned, as in release.yml. Ubuntu 24.04 is glibc 2.39; Ethos's
    # Debian 13 is 2.41, and glibc is backward compatible, so a .deb built here
    # installs there. The AppImage is the fallback if a dependency *name*
    # differs between the two distributions, which glibc versions say nothing
    # about.
    container: ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
    timeout-minutes: 90
    env:
      # linuxdeploy and appimagetool are themselves AppImages, and containers
      # have no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    defaults:
      run:
        # The container's default shell is dash; the steps below use arrays,
        # mapfile and [[ ]].
        shell: bash
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Must run first: bare ubuntu:24.04 ships without curl, wget, git or
          # ca-certificates, and actions/checkout silently falls back to a REST
          # tarball without git. Running as root, so no sudo.
          apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=120 \
            build-essential \
            ca-certificates \
            curl \
            desktop-file-utils \
            file \
            git \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            squashfs-tools \
            wget \
            xdg-utils

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Mark workspace safe for git (containerized job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: desktop/src-tauri

      - name: Install appimagetool
        run: |
          # Pinned to an immutable release tag rather than the mutable
          # `continuous` one, and hash-checked — same reasoning as release.yml.
          wget -q --tries=3 --timeout=30 -O /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum -c
          install -m 755 /tmp/appimagetool /usr/local/bin/appimagetool
          # appimagetool otherwise fetches the type2 runtime from `continuous`
          # at repack time. The runtime is the first code a user executes.
          wget -q --tries=3 --timeout=30 -O /tmp/appimage-runtime \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64"
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/appimage-runtime" | sha256sum -c
          install -D -m 644 /tmp/appimage-runtime /usr/local/lib/appimage-runtime
          echo "APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime" >> "$GITHUB_ENV"

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Patch version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"

      - name: Apply the flavor
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: |
          cd desktop
          # Each `run:` is its own shell, so `eval "$(flavor-config.mjs …)"`
          # here would reach nothing below. $GITHUB_ENV is the crossing that
          # survives into the build step.
          node scripts/flavor-github-env.mjs "$FLAVOR"
          # No `--target`: this job builds for the host, and the script reads
          # the host triple from `rustc -vV` exactly as
          # `scripts/bundle-sidecars.sh` does, so the sidecar filenames the
          # two of them produce and consume cannot disagree.
          node scripts/build-flavor-tauri-config.mjs "$FLAVOR"
          node scripts/stage-flavor-icons.mjs "$FLAVOR"

      - name: Check the flavor really crossed
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: cd desktop && node scripts/check-flavor-crossed.mjs "$FLAVOR"

      - name: Clear embedded assets restored from the cache
        run: |
          # See the Windows job's copy: `rust-cache` restores `target/`, and the
          # brand read-back after the build reads whatever
          # `tauri-codegen-assets` holds.
          find desktop/src-tauri/target -type d -name tauri-codegen-assets -prune -print -exec rm -rf {} + 2>/dev/null || true

      - name: Build sidecars
        run: |
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh

      - name: Build Linux bundles
        run: |
          cd desktop
          pnpm tauri build --verbose --ci \
            --bundles deb,appimage \
            --features mesh-llm \
            --config src-tauri/tauri.flavor.conf.json
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Fix AppImage (remove infra libs, shim host GStreamer)
        run: |
          mapfile -t APPIMAGES < <(find desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f)
          if [[ ${#APPIMAGES[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one AppImage, found ${#APPIMAGES[@]}: ${APPIMAGES[*]-none}"
            exit 1
          fi
          bash desktop/scripts/fix-appimage.sh "${APPIMAGES[0]}"

      - name: Check the .deb wears the flavor
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: |
          # Read back from the artifact, not from the config that produced it.
          # The macOS path learned this twice: a build whose log printed every
          # right value and whose `.app` wore the Buzz bee, and a DMG named one
          # app carrying another's identifier.
          #
          # The *installed icons* are the thing worth reading back here. They
          # are the half of the brand that has silently reverted before, and
          # unlike the identifier they survive into the package as whole files
          # with stable bytes — the identifier is compiled into the binary and
          # then xz-compressed inside `data.tar`, so grepping the `.deb` for it
          # proves only that grep found nothing.
          DEB=$(find desktop/src-tauri/target/release/bundle/deb -name '*.deb' -type f | head -1)
          [[ -n "$DEB" ]] || { echo "::error::no .deb produced"; exit 1; }
          rm -rf /tmp/debroot && dpkg-deb -R "$DEB" /tmp/debroot

          mapfile -t INSTALLED < <(find /tmp/debroot/usr/share/icons -name '*.png' -type f | sort)
          if [[ ${#INSTALLED[@]} -eq 0 ]]; then
            echo "::error::the .deb installs no icons at all"
            exit 1
          fi
          # Every icon the package installs must be byte-identical to one the
          # flavor declares. Asserting set membership rather than a fixed
          # layout keeps this honest if Tauri changes which hicolor directories
          # it writes, while still failing the moment a stock Buzz asset
          # survives into the package.
          OURS=$(cd desktop && node -e '
            import("./scripts/flavor-config.mjs").then(({ loadFlavor }) => {
              const flavor = loadFlavor(process.argv[1]);
              for (const file of Object.values(flavor.platformIcons ?? {}))
                console.log(file);
            });
          ' "$FLAVOR" | while read -r f; do sha256sum "desktop/$f" | cut -d' ' -f1; done)
          if [[ -z "$OURS" ]]; then
            echo "::error::$FLAVOR declares no platformIcons — a Linux build of it would ship the stock Buzz icons"
            exit 1
          fi
          for icon in "${INSTALLED[@]}"; do
            got=$(sha256sum "$icon" | cut -d' ' -f1)
            if ! grep -qx "$got" <<< "$OURS"; then
              echo "::error::${icon#/tmp/debroot} is not one of $FLAVOR's icons"
              exit 1
            fi
            echo "ok: ${icon#/tmp/debroot}"
          done

          # The launcher entry is the other thing a user sees before they ever
          # open the app.
          DESKTOP_FILE=$(find /tmp/debroot/usr/share/applications -name '*.desktop' -type f | head -1)
          [[ -n "$DESKTOP_FILE" ]] || { echo "::error::no .desktop entry in the .deb"; exit 1; }
          PRODUCT=$(cd desktop && node -e '
            import("./scripts/flavor-config.mjs").then(({ loadFlavor }) =>
              console.log(loadFlavor(process.argv[1]).displayName));
          ' "$FLAVOR")
          if ! grep -qx "Name=$PRODUCT" "$DESKTOP_FILE"; then
            echo "::error::the launcher entry is not named $PRODUCT:"
            grep -i '^name' "$DESKTOP_FILE"
            exit 1
          fi
          echo "ok: launcher entry is Name=$PRODUCT"

          # The launcher entry has to be a *valid* desktop entry as well as a
          # correctly named one. `desktop-file-validate` is already installed
          # for this job and it is the only reader of this file that exists
          # before a human looks at a menu.
          desktop-file-validate "$DESKTOP_FILE"
          echo "ok: desktop-file-validate clean"

          # Categories, Exec, Icon and StartupWMClass together. The empty
          # `Categories=` of the built-in template filed the app under nothing
          # in every menu that groups by category, and a StartupWMClass that
          # does not match the window leaves the launcher showing a second
          # generic icon beside the running app.
          MAIN_BIN=$(cd desktop && node -e '
            import("./scripts/flavor-config.mjs").then(({ loadFlavor }) =>
              console.log(loadFlavor(process.argv[1]).mainBinaryName));
          ' "$FLAVOR")
          for expected in \
            "Categories=Network;InstantMessaging;" \
            "Exec=$MAIN_BIN %u" \
            "Icon=$MAIN_BIN" \
            "StartupWMClass=$MAIN_BIN"; do
            if ! grep -qxF "$expected" "$DESKTOP_FILE"; then
              echo "::error::the launcher entry is missing \`$expected\`:"
              cat "$DESKTOP_FILE"
              exit 1
            fi
            echo "ok: $expected"
          done
          # `Comment=` is the tooltip, and it said "Buzz desktop app".
          if grep -qx 'Comment=Buzz desktop app' "$DESKTOP_FILE"; then
            echo "::error::the launcher tooltip still reads \"Buzz desktop app\""
            exit 1
          fi

          # Package metadata. `Maintainer: you` shipped to users because
          # tauri-bundler prefers the Cargo manifest's authors over
          # `bundle.publisher`, so this reads the field back rather than
          # trusting that the flavor declared a publisher.
          MAINTAINER=$(dpkg-deb -f "$DEB" Maintainer)
          DESCRIPTION=$(dpkg-deb -f "$DEB" Description)
          echo "Maintainer: $MAINTAINER"
          echo "Description: $DESCRIPTION"
          for bad in "you" "block"; do
            if [[ "$MAINTAINER" == "$bad" ]]; then
              echo "::error::Maintainer is still the \`$bad\` placeholder"
              exit 1
            fi
          done
          if [[ "$DESCRIPTION" == "Buzz desktop app" ]]; then
            echo "::error::Description is still the trunk's \"Buzz desktop app\""
            exit 1
          fi

          # Icon sizes. `128x128@2x.png` is a 256px image whose *filename*
          # makes Tauri write it to `hicolor/256x256@2/`, which is not a
          # directory in the icon theme specification and is read by nothing —
          # so the launcher had no size above 128px to scale from.
          mapfile -t HICOLOR < <(cd /tmp/debroot/usr/share/icons/hicolor && ls -1d */ | tr -d /)
          echo "hicolor sizes: ${HICOLOR[*]}"
          for size in 256x256 512x512; do
            if [[ ! -d "/tmp/debroot/usr/share/icons/hicolor/$size/apps" ]]; then
              echo "::error::no hicolor/$size — the launcher has nothing sharp to scale from"
              exit 1
            fi
          done
          for dir in "${HICOLOR[@]}"; do
            if [[ "$dir" == *@* ]]; then
              echo "::error::hicolor/$dir is not a directory the icon theme spec defines"
              exit 1
            fi
          done
          echo "ok: hicolor sizes are all real ones, including 256 and 512"

      - name: Check the .deb can be installed next to a real Buzz
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: |
          # The defect this whole change exists for: dpkg refuses to unpack two
          # packages that own one path, and the flavored `.deb` used to claim
          # `/usr/bin/buzz-desktop`, all five sidecars in `/usr/bin`, and the
          # `buzz-desktop` hicolor icon names — every one of them owned by a
          # real Buzz's package.
          #
          # Rather than build stock Buzz as well (a second full Tauri build in
          # the same 90 minutes), this stands up a decoy package that claims
          # exactly the paths a stock build installs, derived from the trunk's
          # own config so the decoy follows a change to that layout. If dpkg
          # accepts both, the collision is gone for the real pair too.
          set -o pipefail
          DEB=$(find desktop/src-tauri/target/release/bundle/deb -name '*.deb' -type f | head -1)
          [[ -n "$DEB" ]] || { echo "::error::no .deb produced"; exit 1; }

          rm -rf /tmp/decoy && mkdir -p /tmp/decoy/DEBIAN /tmp/decoy/usr/bin
          mapfile -t STOCK_PATHS < <(cd desktop && node -e '
            import("node:fs").then(({ readFileSync }) => {
              const config = JSON.parse(
                readFileSync("src-tauri/tauri.conf.json", "utf8"),
              );
              // The main binary: the Cargo bin name, which is what the trunk
              // installs because it sets no `mainBinaryName`.
              console.log("usr/bin/buzz-desktop");
              for (const entry of config.bundle.externalBin ?? [])
                console.log(`usr/bin/${entry.split("/").pop()}`);
              for (const icon of config.bundle.icon ?? []) {
                const name = icon.split("/").pop();
                const match = /^(\d+)x(\d+)(@2x)?\.png$/.exec(name);
                if (match === null) continue;
                const scale = match[3] === undefined ? "" : "@2";
                const size = match[3] === undefined
                  ? `${match[1]}x${match[2]}`
                  : `${Number(match[1]) * 2}x${Number(match[2]) * 2}`;
                console.log(
                  `usr/share/icons/hicolor/${size}${scale}/apps/buzz-desktop.png`,
                );
              }
            });
          ')
          if [[ ${#STOCK_PATHS[@]} -lt 7 ]]; then
            echo "::error::only ${#STOCK_PATHS[@]} stock paths derived — the decoy would prove nothing"
            exit 1
          fi
          printf 'decoy claims %s path(s):\n' "${#STOCK_PATHS[@]}"
          for path in "${STOCK_PATHS[@]}"; do
            echo "  /$path"
            install -D /dev/null "/tmp/decoy/$path"
          done
          cat > /tmp/decoy/DEBIAN/control <<'CONTROL'
          Package: buzz
          Version: 0.0.0-decoy
          Architecture: amd64
          Maintainer: flavor-build decoy <nobody@example.invalid>
          Description: Stands in for a stock Buzz install, claiming its paths
          CONTROL
          # The heredoc above is indented for readability; dpkg wants column 0.
          sed -i 's/^          //' /tmp/decoy/DEBIAN/control
          dpkg-deb -b /tmp/decoy /tmp/stock-buzz-decoy.deb

          # `--unpack`, not `-i`. A path collision is detected while unpacking,
          # which is the failure being reproduced; `-i` would go on to
          # configure and exit non-zero on any unsatisfied runtime dependency,
          # reporting a dependency problem as if it were this one.
          dpkg --unpack /tmp/stock-buzz-decoy.deb
          if ! dpkg --unpack "$DEB"; then
            echo "::error::the flavored .deb still cannot be unpacked beside a stock Buzz"
            exit 1
          fi
          # Both, not just the second: dpkg also "succeeds" by taking a path
          # away from the first package, and that is the outcome being guarded
          # against.
          for package in buzz "$(dpkg-deb -f "$DEB" Package)"; do
            status=$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)
            echo "$package: ${status:-absent}"
            case "$status" in
              *" installed"|*" unpacked") ;;
              *)
                echo "::error::$package did not survive unpacking both packages"
                exit 1
                ;;
            esac
            echo "ok: $package is still unpacked"
          done
          # Every path the decoy claimed must still belong to it.
          for path in "${STOCK_PATHS[@]}"; do
            owner=$(dpkg -S "/$path" 2>/dev/null | cut -d: -f1 || true)
            if [[ "$owner" != "buzz" ]]; then
              echo "::error::/$path is now owned by \`${owner:-nobody}\`, not the stock package"
              exit 1
            fi
          done
          echo "ok: all ${#STOCK_PATHS[@]} stock paths still belong to the stock package"

          # And the sidecars have to be where the app looks for them, with the
          # executable bit intact — `fs::copy` carries the mode across, but a
          # resource is not an `externalBin` and nothing else asserts it.
          BUNDLE_NAME=$(cd desktop && node -e '
            import("./scripts/flavor-config.mjs").then(({ loadFlavor }) =>
              console.log(loadFlavor(process.argv[1]).displayName));
          ' "$FLAVOR")
          SIDECAR_DIR="/usr/lib/$BUNDLE_NAME/sidecars"
          for sidecar in buzz buzz-acp buzz-agent buzz-dev-mcp git-credential-nostr; do
            if [[ ! -x "$SIDECAR_DIR/$sidecar" ]]; then
              echo "::error::$SIDECAR_DIR/$sidecar is missing or not executable"
              ls -la "$SIDECAR_DIR" || true
              exit 1
            fi
            echo "ok: $SIDECAR_DIR/$sidecar"
          done
          # The decoy's `/usr/bin/buzz` is an empty file, so this also proves
          # the two are distinct installs rather than one overwriting the other.
          [[ -s "$SIDECAR_DIR/buzz" ]] || {
            echo "::error::$SIDECAR_DIR/buzz is empty"
            exit 1
          }

          # Best effort: the container is discarded either way, and a removal
          # failure here would fail a job whose real checks have all passed.
          dpkg --purge --force-all "$(dpkg-deb -f "$DEB" Package)" buzz || true

      - name: Read the brand back out of what the build embedded
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: |
          # The `.deb` read-back above covers the icons and the launcher name —
          # files the packager copies. It says nothing about the in-app mark,
          # which is 11 KB of base64 compiled into the binary, and that half now
          # reaches the build through `desktop/.env.production.local` rather than
          # the environment. Without this step a Linux package could pass every
          # check above and still show the Buzz wordmark inside the window.
          cd desktop && node scripts/check-frontend-brand.mjs "$FLAVOR"

      - name: Checksums
        run: |
          cd desktop/src-tauri/target/release/bundle
          find deb appimage -type f \( -name '*.deb' -o -name '*.AppImage' \) \
            -exec sha256sum {} + | tee "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.flavor }}-linux-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    name: Windows (${{ matrix.arch }})
    if: inputs.windows
    runs-on: ${{ matrix.runner }}
    # arm64 is the unproven half: `windows-11-arm` runners are newer than this
    # crate's Windows support, which is 44 platform-specific code sites plus
    # `windows-sys` and the Windows keyring. Letting its failure fail the whole
    # job would throw away the x64 installer Ian can actually use today, so the
    # matrix does not fail fast and arm64 is allowed to fail on its own.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
    steps:
      # The gate is a step rather than a job-level `if:` because `matrix` is not
      # one of the contexts available to `jobs.<id>.if`. The cost is that an
      # unwanted arm64 job still claims a `windows-11-arm` runner to skip every
      # step on; the alternative is building the matrix with `fromJSON`, which
      # moves the same condition into a string of JSON.
      - name: Skip arm64 unless asked
        id: gate
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          WANT_ARM: ${{ inputs.windows_arm }}
        run: |
          # Through `env:`, not interpolated into the script. Both values are
          # trusted here — one is a literal from the matrix, the other a
          # dispatch boolean — but a `run:` block that substitutes a template
          # expression into shell text is a habit that stops being safe the
          # moment one of those values is free-form. (Writing the expression
          # syntax out even inside a comment is itself a parse error for
          # actionlint, which is its own small argument for not doing it.)
          if [[ "$ARCH" == "arm64" && "$WANT_ARM" != "true" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: steps.gate.outputs.run == 'true'
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        if: steps.gate.outputs.run == 'true'
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.gate.outputs.run == 'true'
        with:
          version: 11.4.0

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        if: steps.gate.outputs.run == 'true'
        with:
          # Both workspaces. `desktop/src-tauri` declares its own `[workspace]`,
          # so the five sidecar crates compile in the *root* one into a separate
          # `target/` that this action was not caching at all — an uncached MSVC
          # build of them plus a full Tauri build is what a 90-minute timeout is
          # spent on. `windows-canary.yml` caches the same two paths.
          workspaces: |
            .
            desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install desktop dependencies
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Patch version
        if: steps.gate.outputs.run == 'true' && inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"

      - name: Apply the flavor
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: |
          cd desktop
          node scripts/flavor-github-env.mjs "$FLAVOR"
          # `--target` here, unlike the Linux job: this one cross-builds, so
          # the sidecar source filenames carry `$TARGET` and not the host's
          # triple. `bundle-sidecars.sh "$TARGET"` writes the same names.
          node scripts/build-flavor-tauri-config.mjs "$FLAVOR" --target "$TARGET"
          node scripts/stage-flavor-icons.mjs "$FLAVOR"

      - name: Check the flavor really crossed
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: cd desktop && node scripts/check-flavor-crossed.mjs "$FLAVOR"

      - name: Check this flavor can be a Windows build at all
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: |
          # Before the build, not after it. `platformIcons` is all-four-or-none,
          # so a flavor that declares none — zeniad today — produces an
          # installer wearing the Buzz bee, and the step that caught that used
          # to be the one *after* the Tauri build. Failing here costs seconds
          # instead of an hour, and the message names the file to add.
          WANT=$(cd desktop && node -e '
            import("./scripts/flavor-config.mjs").then(({ loadFlavor }) =>
              console.log(loadFlavor(process.argv[1]).platformIcons?.["icon.ico"] ?? ""));
          ' "$FLAVOR")
          if [[ -z "$WANT" ]]; then
            echo "::error::$FLAVOR declares no platformIcons — add icon.ico (and the three PNGs) to desktop/flavors/$FLAVOR.json before building it for Windows"
            exit 1
          fi
          echo "ok: $FLAVOR declares $WANT"

      - name: Clear embedded assets restored from the cache
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          # `rust-cache` restores `target/`, and the brand read-back after the
          # build reads whatever `tauri-codegen-assets` holds. A previous run's
          # assets left sitting there would let it find another flavor's logo
          # and call this build branded — a gate passing on the artifact it was
          # meant to replace.
          find desktop/src-tauri/target -type d -name tauri-codegen-assets -prune -print -exec rm -rf {} + 2>/dev/null || true

      - name: Build sidecars
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build Windows NSIS installer (unsigned)
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          cd desktop
          # No `webviewInstallMode` override. The default is
          # `downloadBootstrapper`, and the obvious-looking change to
          # `embedBootstrapper` does not buy what its name suggests: tauri-utils
          # documents it as "Requires an internet connection" too — it embeds
          # the 1.8 MB bootstrapper, which then downloads the runtime. The only
          # mode that installs with no network is `offlineInstaller`, at +127 MB.
          # If Ian's VM turns out to have no WebView2 and no network at install
          # time, that is the one line to add:
          #   {"bundle":{"windows":{"webviewInstallMode":{"type":"offlineInstaller"}}}}
          # Windows 11 ships the Evergreen runtime, so the default is expected
          # to be a no-op there.
          pnpm tauri build --verbose --target "$TARGET" \
            --bundles nsis \
            --config src-tauri/tauri.flavor.conf.json
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Check the staged icon is still the flavor's
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: |
          # An NSIS installer is a self-extracting executable, so the icon
          # cannot be read back out of it the way the `.deb` allows. This is a
          # claim about the input — that the file the bundler read is the
          # flavor's and was not restored underneath the build — and it is
          # stated as one. The read-back of what the build actually embedded is
          # the next step.
          WANT=$(cd desktop && node -e '
            import("./scripts/flavor-config.mjs").then(({ loadFlavor }) =>
              console.log(loadFlavor(process.argv[1]).platformIcons?.["icon.ico"] ?? ""));
          ' "$FLAVOR")
          a=$(sha256sum "desktop/$WANT" | cut -d' ' -f1)
          b=$(sha256sum desktop/src-tauri/icons/icon.ico | cut -d' ' -f1)
          [[ "$a" == "$b" ]] || { echo "::error::src-tauri/icons/icon.ico is not $WANT"; exit 1; }
          echo "ok: the bundler read $WANT ($a)"

      - name: Read the brand back out of what the build embedded
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: |
          # The artifact read-back Windows was missing. `tauri-codegen` writes
          # every frontend asset brotli-compressed under
          # `target/<triple>/release/build/buzz-desktop-*/out/tauri-codegen-assets/`
          # and `include_bytes!`s it, and unlike `dist/` — which
          # `tauri-command.mjs` builds into a temp directory and deletes — those
          # files survive. Finding the flavor's product name and its logo bytes
          # in them proves the brand reached the bundle rather than the config
          # that was meant to produce it, which is the distinction a DMG that
          # logged every right value and shipped the Buzz bee was made of.
          #
          # It is also the only end-to-end proof that the oversized logo values
          # travelling by `desktop/.env.production.local` were read by Vite.
          cd desktop && node scripts/check-frontend-brand.mjs "$FLAVOR" --target "$TARGET"

      - name: Mark the installer unsigned
        if: steps.gate.outputs.run == 'true'
        id: artifacts
        shell: bash
        env:
          FLAVOR: ${{ inputs.flavor }}
          ARCH: ${{ matrix.arch }}
        run: |
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle"
          EXE=$(find "$BUNDLE_DIR/nsis" -name '*.exe' -type f | head -1)
          if [[ -z "$EXE" ]]; then
            echo "::error::No NSIS installer found in $BUNDLE_DIR/nsis"
            exit 1
          fi

          # What the filename is allowed to prove, and no more. Tauri builds it
          # from the main binary's name, the version and the arch, but whether
          # that name is `productName` or the Cargo bin name depends on
          # `mainBinaryName` — which this branch does not set and #31 does — and
          # nothing on the build Mac can run the Windows bundler to settle it.
          # So the assertions below are the two that hold either way, and the
          # full name is printed so the first real run states the format
          # instead of this comment guessing it.
          NAME=$(basename "$EXE")
          echo "installer: $NAME" | tee -a "$GITHUB_STEP_SUMMARY"

          # A build whose flavor `--config` was dropped is named after the
          # trunk. This build passes three of them — `tauri-command.mjs` injects
          # its own frontendDist override on top of the flavor delta — so "one
          # of them silently won" is a real shape, not a hypothetical.
          case "$NAME" in
            Buzz_*|buzz_*)
              echo "::error::the installer is named $NAME — the flavor config did not reach the bundler"
              exit 1
              ;;
          esac
          # The other leg's architecture in this leg's output means the matrix
          # built the wrong thing. Checked by exclusion rather than by asserting
          # the exact token's position, for the same reason as above.
          case "$ARCH:$NAME" in
            x64:*arm64*)
              echo "::error::the x64 job produced $NAME"
              exit 1
              ;;
            arm64:*_x64*)
              echo "::error::the arm64 job produced $NAME"
              exit 1
              ;;
          esac
          case "$NAME" in
            *-setup.exe) ;;
            *)
              echo "::error::$NAME is not an NSIS installer"
              exit 1
              ;;
          esac
          # Same `_alpha-unsigned` marker release.yml uses. SmartScreen will
          # warn on first run and the filename should say why before the dialog
          # does.
          MARKED="$(dirname "$EXE")/$(basename "$EXE" .exe)_alpha-unsigned.exe"
          mv "$EXE" "$MARKED"
          echo "exe=$MARKED" >> "$GITHUB_OUTPUT"
          sha256sum "$MARKED" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.gate.outputs.run == 'true'
        with:
          name: ${{ inputs.flavor }}-windows-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ steps.artifacts.outputs.exe }}
